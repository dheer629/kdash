apiVersion: v1
kind: Namespace
metadata:
  name: kdash-e2e
  labels: {app.kubernetes.io/part-of: kdash-validation}
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: kdash-e2e-data
spec:
  capacity: {storage: 64Mi}
  accessModes: [ReadWriteMany]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  hostPath: {path: /tmp/kdash-e2e-data, type: DirectoryOrCreate}
  claimRef: {namespace: kdash-e2e, name: app-data}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: app-data, namespace: kdash-e2e}
spec:
  accessModes: [ReadWriteMany]
  resources: {requests: {storage: 64Mi}}
  storageClassName: ""
  volumeName: kdash-e2e-data
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: app-server, namespace: kdash-e2e}
spec:
  replicas: 2
  selector: {matchLabels: {app: kdash-e2e, role: server}}
  template:
    metadata: {labels: {app: kdash-e2e, role: server}}
    spec:
      containers:
      - name: app
        image: busybox:1.36
        command: [sh, -c]
        args:
        - |
          mkdir -p /tmp/kdash-transfer /data
          printf 'live Kubernetes dashboard validation\n' > /data/index.html
          printf 'seed file from a real running container\n' > /tmp/kdash-transfer/seed.txt
          httpd -p 8080 -h /data
          i=0
          while :; do
            echo "$(date -Iseconds) INFO request=$i service=app-server healthy=true"
            echo "$(date -Iseconds) WARN request=$i demonstration warning from live workload"
            i=$((i+1)); sleep 2
          done
        ports: [{containerPort: 8080}]
        resources:
          requests: {cpu: 20m, memory: 8Mi}
          limits: {cpu: 200m, memory: 64Mi}
        readinessProbe: {httpGet: {path: /, port: 8080}, periodSeconds: 3}
        volumeMounts: [{name: data, mountPath: /data}]
      - name: sidecar
        image: busybox:1.36
        command: [sh, -c, 'while :; do echo "$(date -Iseconds) INFO sidecar heartbeat"; sleep 3; done']
        resources:
          requests: {cpu: 5m, memory: 4Mi}
          limits: {cpu: 50m, memory: 32Mi}
      volumes: [{name: data, persistentVolumeClaim: {claimName: app-data}}]
---
apiVersion: v1
kind: Service
metadata: {name: app-server, namespace: kdash-e2e}
spec:
  selector: {app: kdash-e2e, role: server}
  ports: [{port: 80, targetPort: 8080}]
---
apiVersion: v1
kind: Service
metadata: {name: missing-backend, namespace: kdash-e2e}
spec:
  selector: {app: does-not-exist}
  ports: [{port: 80, targetPort: 8080}]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: {name: app-server, namespace: kdash-e2e}
spec:
  rules:
  - host: kdash.test
    http:
      paths:
      - path: /
        pathType: Prefix
        backend: {service: {name: app-server, port: {number: 80}}}
---
apiVersion: v1
kind: Pod
metadata: {name: z-crash, namespace: kdash-e2e, labels: {app: kdash-e2e, role: failure}}
spec:
  containers:
  - name: crash
    image: busybox:1.36
    command: [sh, -c, 'echo "ERROR intentional validation failure exit=42"; sleep 3; exit 42']
    resources:
      requests: {cpu: 5m, memory: 4Mi}
      limits: {cpu: 50m, memory: 32Mi}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: z-unbound, namespace: kdash-e2e}
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: kdash-e2e-intentionally-missing
  resources: {requests: {storage: 32Mi}}
---
apiVersion: v1
kind: Pod
metadata: {name: z-pending, namespace: kdash-e2e, labels: {app: kdash-e2e, role: pending}}
spec:
  containers:
  - name: pending
    image: busybox:1.36
    command: [sh, -c, 'sleep 86400']
    volumeMounts: [{name: missing, mountPath: /data}]
    resources:
      requests: {cpu: 5m, memory: 4Mi}
      limits: {cpu: 50m, memory: 32Mi}
  volumes: [{name: missing, persistentVolumeClaim: {claimName: z-unbound}}]
---
apiVersion: batch/v1
kind: Job
metadata: {name: completed-check, namespace: kdash-e2e}
spec:
  template:
    metadata: {labels: {app: kdash-e2e, role: job}}
    spec:
      restartPolicy: Never
      containers:
      - name: check
        image: busybox:1.36
        command: [sh, -c, 'echo "INFO completed live validation job"']
        resources:
          requests: {cpu: 5m, memory: 4Mi}
          limits: {cpu: 50m, memory: 32Mi}
