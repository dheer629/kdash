name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Bash modules, fixture tests, payload, checksums
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show environment
        run: |
          bash --version | head -1
          awk --version | head -1 || true
          if command -v kubectl >/dev/null 2>&1; then
            kubectl version --client
          else
            echo "kubectl not installed; fixture tests use stubs and require no cluster"
          fi

      - name: Validate everything this repository publishes
        run: bash scripts/validate-all.sh
