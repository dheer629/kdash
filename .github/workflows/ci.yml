name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: bash syntax, tests, payload, checksums
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show environment
        run: |
          bash --version | head -1
          awk --version | head -1 || true
          kubectl version --client 2>/dev/null | head -1 || echo "kubectl not installed (not needed by these checks)"

      - name: Validate everything this repository publishes
        run: bash scripts/validate-all.sh
